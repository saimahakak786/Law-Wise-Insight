name: LawVise Database Migration

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      - name: Generate SQL migration
        working-directory: lib/db
        run: pnpm exec drizzle-kit generate --config ./drizzle.config.ts

      - name: Upload migration SQL
        uses: actions/upload-artifact@v4
        with:
          name: lawvise-database-migration
          path: lib/db/drizzle/
