name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  eas-buildId:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install Workspace Dependencies
        run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      - name: Install EAS CLI Globally
        run: npm install -g eas-cli

      - name: Prepare Mobile Workspace Bundle
        run: |
          cd artifacts/mobile
          pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      - name: Commit pnpm Lock File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --staged --quiet || git commit -m "chore: auto-generate pnpm-lock.yaml"
          git push || echo "No changes to push"

      - name: Create .env file for Mobile Bundle
        run: |
          echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}" > artifacts/mobile/.env
          echo "EXPO_PUBLIC_API_URL=${{ secrets.EXPO_PUBLIC_API_URL }}" >> artifacts/mobile/.env

      - name: Build Android App Locally
        working-directory: artifacts/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --platform android --local --profile preview --non-interactive

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: artifacts/mobile/**/*.apk
