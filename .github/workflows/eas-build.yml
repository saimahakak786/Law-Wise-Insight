name: EAS Build

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Purge pnpm files if any
        working-directory: artifacts/mobile
        run: |
          rm -f pnpm-lock.yaml
          rm -f pnpm-workspace.yaml

      - name: Install dependencies with npm
        working-directory: artifacts/mobile
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Build Android App on EAS Cloud
        working-directory: artifacts/mobile
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_DOMAIN: law-wise-insight.onrender.com
