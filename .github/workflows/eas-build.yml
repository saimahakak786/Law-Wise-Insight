name: EAS Build

on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm globally
        run: npm install -g pnpm

      - name: Configure pnpm for Metro Bundler (Flat node_modules)
        run: |
          echo "node-linker=hoisted" > artifacts/mobile/.npmrc
          echo "shamefully-hoist=true" >> artifacts/mobile/.npmrc
          echo "strictDepBuilds=false" >> artifacts/mobile/.npmrc

      - name: Install dependencies with pnpm
        working-directory: artifacts/mobile
        run: pnpm install --no-frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: pnpm

      - name: Build Android app locally
        working-directory: artifacts/mobile
        run: eas build --platform android --profile production --non-interactive --local --output ./app-release.apk
        env:
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_DOMAIN: law-wise-insight.onrender.com
          GRADLE_OPTS: -Xmx512m -XX:MaxMetaspaceSize=1024m -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: artifacts/mobile/app-release.apk
