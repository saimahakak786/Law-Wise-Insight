name: LawVise Database Setup

on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --config.strict-dep-builds=false

      - name: Generate database migration
        working-directory: lib/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec drizzle-kit generate --config ./drizzle.config.ts

      - name: Apply migration to PostgreSQL
        working-directory: lib/db
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DATABASE_URL="$(printf '%s' "$DATABASE_URL" | tr -d '\r\n')"
          export DATABASE_URL

          SQL_FILE=$(find drizzle -maxdepth 1 -type f -name '*.sql' | sort | tail -n 1)

          if [ -z "$SQL_FILE" ]; then
            echo "No SQL migration file found"
            exit 1
          fi

          echo "Applying migration: $SQL_FILE"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$SQL_FILE"
