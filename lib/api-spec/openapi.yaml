openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: LawVise API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: lawvise
    description: LawVise legal AI operations
  - name: storage
    description: Object storage operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /lawvise/upload:
    post:
      operationId: uploadDocument
      tags: [lawvise]
      summary: Upload a document file (PDF, DOCX, image) and extract text via OCR
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadDocumentBody"
      responses:
        "200":
          description: Extracted text and storage path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadDocumentResponse"

  /lawvise/analyze:
    post:
      operationId: analyzeDocument
      tags: [lawvise]
      summary: Analyze a legal document (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentAnalysisInput"
      responses:
        "200":
          description: SSE stream of analysis
          content:
            text/event-stream:
              schema:
                type: string

  /lawvise/chat:
    post:
      operationId: legalChat
      tags: [lawvise]
      summary: Legal AI chat (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalChatInput"
      responses:
        "200":
          description: SSE stream of chat response
          content:
            text/event-stream:
              schema:
                type: string

  /lawvise/research:
    post:
      operationId: legalResearch
      tags: [lawvise]
      summary: AI legal research on Indian laws and case law (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalResearchInput"
      responses:
        "200":
          description: SSE stream of research results
          content:
            text/event-stream:
              schema:
                type: string

  /lawvise/draft:
    post:
      operationId: draftDocument
      tags: [lawvise]
      summary: Draft a legal document (SSE stream)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentDraftInput"
      responses:
        "200":
          description: SSE stream of draft
          content:
            text/event-stream:
              schema:
                type: string

  /lawvise/calculate/limitation:
    post:
      operationId: calculateLimitation
      tags: [lawvise]
      summary: Calculate limitation period
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitationInput"
      responses:
        "200":
          description: Limitation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LimitationResult"

  /lawvise/calculate/court-fee:
    post:
      operationId: calculateCourtFee
      tags: [lawvise]
      summary: Calculate court fee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourtFeeInput"
      responses:
        "200":
          description: Court fee result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourtFeeResult"

  /lawvise/documents:
    get:
      operationId: getDocuments
      tags: [lawvise]
      summary: List user's saved documents
      parameters:
        - name: folderId
          in: query
          schema:
            type: ["integer", "null"]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalDocument"
    post:
      operationId: saveDocument
      tags: [lawvise]
      summary: Save a document to vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalDocumentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"

  /lawvise/documents/{id}:
    patch:
      operationId: updateDocument
      tags: [lawvise]
      summary: Update a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalDocumentUpdate"
      responses:
        "200":
          description: Updated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalDocument"
    delete:
      operationId: deleteDocument
      tags: [lawvise]
      summary: Delete a document
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /lawvise/folders:
    get:
      operationId: getFolders
      tags: [lawvise]
      summary: List user's document folders
      responses:
        "200":
          description: List of folders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentFolder"
    post:
      operationId: createFolder
      tags: [lawvise]
      summary: Create a new folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFolderBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFolder"

  /lawvise/folders/{id}:
    patch:
      operationId: updateFolder
      tags: [lawvise]
      summary: Rename a folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFolderBody"
      responses:
        "200":
          description: Updated folder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentFolder"
    delete:
      operationId: deleteFolder
      tags: [lawvise]
      summary: Delete a folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /lawvise/cases:
    get:
      operationId: getCases
      tags: [lawvise]
      summary: List user's cases
      responses:
        "200":
          description: List of cases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LegalCase"
    post:
      operationId: createCase
      tags: [lawvise]
      summary: Create a new case
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalCaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"

  /lawvise/cases/{id}:
    patch:
      operationId: updateCase
      tags: [lawvise]
      summary: Update a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalCaseUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegalCase"
    delete:
      operationId: deleteCase
      tags: [lawvise]
      summary: Delete a case
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /lawvise/settings:
    get:
      operationId: getSettings
      tags: [lawvise]
      summary: Get user settings
      responses:
        "200":
          description: User settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"
    put:
      operationId: updateSettings
      tags: [lawvise]
      summary: Update user settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsBody"
      responses:
        "200":
          description: Updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSettings"

  /lawvise/notifications/register:
    post:
      operationId: registerPushToken
      tags: [lawvise]
      summary: Register Expo push notification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenBody"
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPushTokenResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL for file storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    UploadDocumentBody:
      type: object
      required: [fileBase64, mimeType, fileName]
      properties:
        fileBase64:
          type: string
          description: Base64-encoded file content
        mimeType:
          type: string
          description: "MIME type: application/pdf, application/vnd.openxmlformats-officedocument.wordprocessingml.document, image/jpeg, image/png, etc."
        fileName:
          type: string
        language:
          type: ["string", "null"]

    UploadDocumentResponse:
      type: object
      required: [extractedText, fileName, mimeType]
      properties:
        extractedText:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        pageCount:
          type: ["integer", "null"]
        objectPath:
          type: ["string", "null"]

    DocumentAnalysisInput:
      type: object
      required: [content, analysisType, documentType]
      properties:
        content:
          type: string
        analysisType:
          type: string
          enum:
            - summarize
            - clause_analysis
            - risk_analysis
            - key_points
            - legal_issues
            - relevant_sections
            - case_citations
            - full_analysis
        documentType:
          type: string
        jurisdiction:
          type: ["string", "null"]
        language:
          type: ["string", "null"]

    LegalResearchInput:
      type: object
      required: [query]
      properties:
        query:
          type: string
        jurisdiction:
          type: ["string", "null"]
          default: "India"
        researchType:
          type: ["string", "null"]
          enum: [case_law, statute, general, null]
        language:
          type: ["string", "null"]

    LegalChatInput:
      type: object
      required: [message]
      properties:
        message:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        jurisdiction:
          type: ["string", "null"]
        language:
          type: ["string", "null"]

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    DocumentDraftInput:
      type: object
      required: [documentType, jurisdiction]
      properties:
        documentType:
          type: string
          enum:
            - legal_notice
            - plaint
            - written_statement
            - affidavit
            - bail_application
            - contract
            - agreement
            - petition
            - reply_notice
            - power_of_attorney
            - memorandum
            - writ_petition
        jurisdiction:
          type: string
        details:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        parties:
          type: ["object", "null"]
          additionalProperties: true

    LimitationInput:
      type: object
      required: [caseType, jurisdiction]
      properties:
        caseType:
          type: string
        jurisdiction:
          type: string
        eventDate:
          type: ["string", "null"]

    LimitationResult:
      type: object
      required: [periodYears, description, deadline]
      properties:
        periodYears:
          type: number
        description:
          type: string
        deadline:
          type: ["string", "null"]
        notes:
          type: string
        applicableLaw:
          type: ["string", "null"]

    CourtFeeInput:
      type: object
      required: [courtType, caseType, jurisdiction]
      properties:
        courtType:
          type: string
        caseType:
          type: string
        jurisdiction:
          type: string
        claimAmount:
          type: ["number", "null"]
        reliefSought:
          type: ["string", "null"]

    CourtFeeResult:
      type: object
      required: [baseFee, totalFee, description]
      properties:
        baseFee:
          type: number
        additionalFees:
          type: array
          items:
            $ref: "#/components/schemas/FeeBreakdown"
        totalFee:
          type: number
        description:
          type: string
        applicableAct:
          type: ["string", "null"]
        exemptions:
          type: ["string", "null"]

    FeeBreakdown:
      type: object
      required: [name, amount]
      properties:
        name:
          type: string
        amount:
          type: number

    LegalDocument:
      type: object
      required: [id, title, documentType, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        documentType:
          type: string
        content:
          type: ["string", "null"]
        analysisType:
          type: ["string", "null"]
        analysisResult:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        folderId:
          type: ["integer", "null"]
        isFavorite:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    LegalDocumentInput:
      type: object
      required: [title, documentType]
      properties:
        title:
          type: string
        documentType:
          type: string
        content:
          type: ["string", "null"]
        analysisType:
          type: ["string", "null"]
        analysisResult:
          type: ["string", "null"]
        fileUrl:
          type: ["string", "null"]
        folderId:
          type: ["integer", "null"]

    LegalDocumentUpdate:
      type: object
      properties:
        title:
          type: string
        folderId:
          type: ["integer", "null"]
        isFavorite:
          type: boolean
        analysisResult:
          type: ["string", "null"]

    DocumentFolder:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        color:
          type: ["string", "null"]
        createdAt:
          type: string

    CreateFolderBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        color:
          type: ["string", "null"]

    UpdateFolderBody:
      type: object
      properties:
        name:
          type: string
        color:
          type: ["string", "null"]

    LegalCase:
      type: object
      required: [id, title, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        userId:
          type: string
        title:
          type: string
        caseNumber:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, pending, closed, won, lost]
        description:
          type: ["string", "null"]
        hearingDate:
          type: ["string", "null"]
        nextAction:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, null]
        createdAt:
          type: string
        updatedAt:
          type: string

    LegalCaseInput:
      type: object
      required: [title, status]
      properties:
        title:
          type: string
        caseNumber:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, pending, closed, won, lost]
        description:
          type: ["string", "null"]
        hearingDate:
          type: ["string", "null"]
        nextAction:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, null]

    LegalCaseUpdate:
      type: object
      properties:
        title:
          type: string
        caseNumber:
          type: ["string", "null"]
        court:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, pending, closed, won, lost]
        description:
          type: ["string", "null"]
        hearingDate:
          type: ["string", "null"]
        nextAction:
          type: ["string", "null"]
        priority:
          type: ["string", "null"]
          enum: [low, medium, high, null]

    UserSettings:
      type: object
      required: [userId, language, jurisdiction, notificationsEnabled]
      properties:
        userId:
          type: string
        language:
          type: string
          enum: [en, hi, ur]
        jurisdiction:
          type: string
        notificationsEnabled:
          type: boolean
        pushToken:
          type: ["string", "null"]
        theme:
          type: ["string", "null"]
          enum: [dark, light, null]

    UpdateSettingsBody:
      type: object
      properties:
        language:
          type: string
          enum: [en, hi, ur]
        jurisdiction:
          type: string
        notificationsEnabled:
          type: boolean
        theme:
          type: ["string", "null"]
          enum: [dark, light, null]

    RegisterPushTokenBody:
      type: object
      required: [token]
      properties:
        token:
          type: string
        platform:
          type: ["string", "null"]
          enum: [ios, android, web, null]

    RegisterPushTokenResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    RequestUploadUrlBody:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string

    RequestUploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            size:
              type: integer
            contentType:
              type: string
