services:
  - type: web
    name: law-wise-insight
    env: node
    region: oregon
    plan: free
    buildCommand: npx pnpm install --no-frozen-lockfile && cd artifacts/api-server && npx pnpm add drizzle-orm drizzle-kit && cd ../.. && pnpm --prefix artifacts/api-server run build
    startCommand: cd artifacts/api-server && npx drizzle-kit push --config=../../lib/db/drizzle.config.ts && pnpm start
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
